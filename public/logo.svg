<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" fill="none">
  <defs>
    <!-- Background Radial Glow -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff7b00" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#090a0f" stop-opacity="0" />
    </radialGradient>

    <!-- Metallic/Orange Accent Gradient -->
    <linearGradient id="primaryGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff9d00" />
      <stop offset="50%" stop-color="#ff5500" />
      <stop offset="100%" stop-color="#d93800" />
    </linearGradient>

    <!-- Secondary Glass Gradient -->
    <linearGradient id="glassGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e2330" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0.95" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="orangeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="100" cy="100" r="90" fill="url(#bgGlow)" />

  <!-- Outer Glass Frame (Meridian Polygon) -->
  <path d="M40 30 L160 30 L160 130 L130 160 L40 160 Z" fill="url(#glassGradient)" stroke="#ff7b00" stroke-width="2.5" stroke-opacity="0.4" rx="8" />

  <!-- Accent Chamfer Edge (Brand Mark Geometric Polygon) -->
  <path d="M48 38 L152 38 L152 124 L124 152 L48 152 Z" fill="none" stroke="url(#primaryGradient)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Inner Calendar Grid Elements -->
  <!-- Top Bar -->
  <line x1="60" y1="65" x2="140" y2="65" stroke="#ffffff" stroke-opacity="0.2" stroke-width="2" stroke-linecap="round" />
  
  <!-- Rings/Pegs -->
  <circle cx="75" cy="50" r="4.5" fill="url(#primaryGradient)" filter="url(#orangeGlow)" />
  <circle cx="125" cy="50" r="4.5" fill="url(#primaryGradient)" filter="url(#orangeGlow)" />

  <!-- Grid Dots / Event Nodes -->
  <circle cx="75" cy="85" r="5" fill="#ffffff" fill-opacity="0.9" />
  <circle cx="100" cy="85" r="5" fill="url(#primaryGradient)" filter="url(#orangeGlow)" />
  <circle cx="125" cy="85" r="5" fill="#ffffff" fill-opacity="0.3" />

  <circle cx="75" cy="110" r="5" fill="#ffffff" fill-opacity="0.3" />
  <circle cx="100" cy="110" r="5" fill="#ffffff" fill-opacity="0.9" />
  <circle cx="125" cy="110" r="5" fill="url(#primaryGradient)" filter="url(#orangeGlow)" />

  <circle cx="75" cy="135" r="5" fill="url(#primaryGradient)" filter="url(#orangeGlow)" />
  <circle cx="100" cy="135" r="5" fill="#ffffff" fill-opacity="0.3" />

  <!-- Sparkle / Intelligence Lightning Mark -->
  <path d="M142 95 L148 107 L142 105 L144 115 L136 103 L142 105 Z" fill="#ffb700" filter="url(#orangeGlow)" />
</svg>
